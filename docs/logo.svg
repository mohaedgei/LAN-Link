<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-label="LAN-Link">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf7ef"/>
      <stop offset="1" stop-color="#a7e3bd"/>
    </linearGradient>
  </defs>

  <!-- icon: two linked chain rings -->
  <g transform="translate(28,40)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#lg)"/>
    <g fill="none" stroke="#04170b" stroke-width="6" stroke-linecap="round">
      <path d="M33 44a11 11 0 0 0 16.5 1.1l6.6-6.6a11 11 0 0 0-15.5-15.5l-3.7 3.7"/>
      <path d="M47 36a11 11 0 0 0-16.5-1.1l-6.6 6.6a11 11 0 0 0 15.5 15.5l3.7-3.7"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="130" y="98" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="64" font-weight="800" letter-spacing="1" fill="url(#tg)">LAN-Link</text>

  <!-- tagline -->
  <text x="132" y="128" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="17" fill="#5c8a70">screen &amp; camera streaming over local WiFi</text>
</svg>
