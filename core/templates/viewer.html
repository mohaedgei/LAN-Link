<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN-Link Viewer</title>
<style>
  :root { color-scheme: dark; --bg:#06130c; --card:#0d2416; --line:#1e4630;
          --txt:#eaf7ef; --dim:#93c4a8; --acc:#22c55e; --acc2:#4ade80; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: radial-gradient(1200px 600px at 50% -10%, #0a2415 0%, var(--bg) 55%);
         color: var(--txt); font-family: system-ui, "Segoe UI", Roboto, sans-serif;
         min-height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 18px;
           background: rgba(13,36,22,.9); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
  .brand svg { filter: drop-shadow(0 0 6px rgba(34,197,94,.6)); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #274434; }
  .dot.on { background: var(--acc2); box-shadow: 0 0 10px var(--acc2); }
  .feat { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { background: #12301e; color: var(--txt); border: 1px solid var(--line);
           padding: 8px 14px; border-radius: 10px; font-size: 13px; cursor: pointer;
           transition: background .15s, transform .05s; }
  button:hover { background: #1a4529; }
  button:active { transform: scale(.97); }
  button.active { background: linear-gradient(135deg,#16a34a,#4ade80); color: #04170b;
                  border-color: transparent; font-weight: 700; }
  .apk { text-decoration: none; color: #04170b; font-weight: 700; font-size: 13px;
         background: linear-gradient(135deg,#22c55e,#84cc16); padding: 9px 14px;
         border-radius: 10px; box-shadow: 0 4px 14px rgba(34,197,94,.35); }
  .apk:hover { filter: brightness(1.08); }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 14px; }
  #stage { position: relative; max-width: 96vw; max-height: 78vh; }
  canvas { background: #050d08; border: 1px solid var(--line); border-radius: 14px;
           box-shadow: 0 12px 40px rgba(0,0,0,.5), 0 0 0 4px rgba(34,197,94,.06);
           max-width: 96vw; max-height: 78vh; cursor: crosshair; touch-action: none; }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             pointer-events: none; text-align: center; }
  #overlay .panel { pointer-events: auto; background: rgba(9,28,17,.88); border: 1px solid var(--line);
                    border-radius: 18px; padding: 26px 30px; backdrop-filter: blur(4px); }
  #overlay .panel h2 { font-size: 17px; margin-bottom: 8px; color: var(--acc2); }
  #overlay .panel p { color: var(--dim); font-size: 13.5px; line-height: 1.7; margin-bottom: 14px; }
  #overlay .panel b { color: var(--txt); }
  #overlay .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .ghost { display: inline-block; text-decoration: none; color: var(--dim); font-size: 12.5px;
           border: 1px solid var(--line); padding: 9px 14px; border-radius: 10px; }
  .ghost:hover { color: var(--txt); border-color: var(--acc); }
  footer { background: rgba(13,36,22,.9); border-top: 1px solid var(--line); padding: 10px 14px;
           display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  input[type=text] { background: #081c10; border: 1px solid var(--line); color: var(--txt);
                     padding: 8px 12px; border-radius: 10px; min-width: 220px; font-size: 13px; }
  input[type=text]:focus { outline: none; border-color: var(--acc); }
  .stat { color: var(--dim); font-size: 12px; margin-left: 10px; }
  .credit { width: 100%; text-align: center; color: #5c8a70; font-size: 11.5px; margin-top: 2px; }
  .credit a { color: var(--acc); text-decoration: none; font-weight: 600; }
  #toast { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
           background: #b91c1c; color: #fff; padding: 9px 16px; border-radius: 10px;
           font-size: 13px; display: none; z-index: 9; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round">
      <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/>
      <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>
    </svg>
    LAN-Link
  </div>
  <div class="dot" id="devDot" title="Device connected"></div>
  <span class="stat" id="devStat">waiting for device&hellip;</span>
  <div class="feat">
    <button data-f="screen" id="bScreen">Screen share</button>
    <button data-f="front"  id="bFront">Front camera</button>
    <button data-f="back"   id="bBack">Back camera</button>
    <button data-f="stop"   id="bStop">Stop</button>
    <a class="apk" href="/app.apk?t=$token" title="Download the LAN-Link app (APK)">&#11015; Get the app</a>
  </div>
</header>

<main>
  <div id="stage">
    <canvas id="screen" width="960" height="540"></canvas>
    <div id="overlay">
      <div class="panel">
        <h2>Waiting for your phone&hellip;</h2>
        <p>
          Scan the <b>QR code</b> shown in the terminal with the LAN-Link app
          (or Google Lens) &mdash; the stream starts automatically.
        </p>
        <div class="actions">
          <a class="apk" href="/app.apk?t=$token">&#11015; Install the app (APK)</a>
          <a class="ghost" href="$repo_url/releases" target="_blank" rel="noopener">Releases page</a>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  <button data-k="back">&#9664; Back</button>
  <button data-k="home">&#8962; Home</button>
  <button data-k="recents">&#9776; Recents</button>
  <button data-p="out">&#128269; Zoom &#8722;</button>
  <button data-p="in">Zoom &#43;</button>
  <input type="text" id="txt" placeholder="Type text to the phone&hellip;">
  <button id="sendTxt">Send</button>
  <span class="stat" id="fps"></span>
  <div class="credit">LAN-Link &mdash; local WiFi streaming &middot; made by <a href="https://t.me/Py_RHL" target="_blank" rel="noopener">@Py_RHL</a></div>
</footer>
<div id="toast"></div>

<script>
  var TOKEN = "$token";
  var START_FEATURE = "$feature";
  var ws = null, overlay = document.getElementById("overlay"),
      canvas = document.getElementById("screen"), ctx = canvas.getContext("2d"),
      devDot = document.getElementById("devDot"), devStat = document.getElementById("devStat"),
      fpsEl = document.getElementById("fps"), toastEl = document.getElementById("toast");
  var frames = 0, lastFps = Date.now(), downPos = null;

  function toast(msg) {
    toastEl.textContent = msg; toastEl.style.display = "block";
    setTimeout(function () { toastEl.style.display = "none"; }, 2600);
  }

  function connect() {
    ws = new WebSocket("ws://" + location.host + "/ws?t=" + TOKEN + "&role=viewer");
    ws.binaryType = "blob";
    ws.onopen = function () { if (START_FEATURE && START_FEATURE !== "none") { send({ type: "feature", value: START_FEATURE }); } };
    ws.onmessage = function (ev) {
      if (ev.data instanceof Blob) {
        var bmp = createImageBitmap(ev.data);
        bmp.then(function (img) {
          canvas.width = img.width; canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          overlay.style.display = "none";
          frames++;
        });
      } else {
        try { var msg = JSON.parse(ev.data); } catch (e) { return; }
        if (msg.type === "status") {
          if (msg.value === "device-connected") { devDot.className = "dot on"; devStat.textContent = "device connected"; }
          if (msg.value === "device-disconnected") { devDot.className = "dot"; devStat.textContent = "device disconnected"; }
          if (msg.value === "no-device") { toast("No phone connected yet — scan the QR with the LAN-Link app"); }
          if (msg.value === "capture-started") { devStat.textContent = "streaming"; }
        }
      }
    };
    ws.onclose = function () { devDot.className = "dot"; devStat.textContent = "server offline — retrying"; setTimeout(connect, 2000); };
    ws.onerror = function () { ws.close(); };
  }

  function send(obj) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(obj)); } }

  function markActive(feature) {
    ["bScreen","bFront","bBack"].forEach(function (id) { document.getElementById(id).className = ""; });
    if (feature === "screen") bScreen.className = "active";
    if (feature === "front") bFront.className = "active";
    if (feature === "back") bBack.className = "active";
  }

  document.querySelectorAll("[data-f]").forEach(function (btn) {
    btn.onclick = function () {
      var f = btn.getAttribute("data-f");
      send({ type: "feature", value: f });
      markActive(f);
    };
  });
  document.querySelectorAll("[data-k]").forEach(function (btn) {
    btn.onclick = function () { send({ type: "key", value: btn.getAttribute("data-k") }); };
  });
  document.querySelectorAll("[data-p]").forEach(function (btn) {
    btn.onclick = function () { send({ type: "pinch", dir: btn.getAttribute("data-p") }); };
  });
  document.getElementById("sendTxt").onclick = sendText;
  document.getElementById("txt").addEventListener("keydown", function (e) { if (e.key === "Enter") sendText(); });
  function sendText() {
    var v = document.getElementById("txt").value;
    if (v) { send({ type: "text", value: v }); document.getElementById("txt").value = ""; }
  }

  // Pointer: short press = tap, drag = swipe (normalized 0..1 coordinates)
  canvas.addEventListener("pointerdown", function (e) { downPos = pos(e); });
  canvas.addEventListener("pointerup", function (e) {
    if (!downPos) return;
    var p = pos(e), dx = p.x - downPos.x, dy = p.y - downPos.y;
    if (Math.abs(dx) < 0.02 && Math.abs(dy) < 0.02) {
      send({ type: "tap", x: p.x, y: p.y });
    } else {
      send({ type: "swipe", x1: downPos.x, y1: downPos.y, x2: p.x, y2: p.y, ms: 300 });
    }
    downPos = null;
  });
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1),
             y: Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1) };
  }

  setInterval(function () {
    var now = Date.now();
    fpsEl.textContent = frames + " fps";
    frames = 0;
  }, 1000);

  connect();
</script>
</body>
</html>
